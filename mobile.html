<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CineQueue - Mobile</title>
  <style>
    /* تنظیمات پایه موبایل */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      direction: ltr; /* برای حفظ چیدمان انگلیسی سایت */
    }

    /* هدر و لوگو */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 15px 0;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 15px;
    }

    .logo {
      color: #f59e0b;
      font-weight: bold;
      font-size: 1.2rem;
      text-decoration: none;
    }

    /* کانتینر پلیر - نسبت ۱۶:۹ متناسب با گوشی */
    .player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .player-box iframe, 
    .player-box video {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* جزئیات فیلم */
    .movie-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 15px;
    }

    .poster {
      width: 140px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .details h1 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .details p {
      color: #94a3b8;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    /* دکمه‌های دانلود */
    .download-section {
      width: 100%;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dl-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">CineQueue</a>
  </header>

  <main>
    <div class="player-box" id="playerContainer">
      </div>

    <div class="movie-card">
      <img src="" alt="Movie Poster" class="poster" id="moviePoster">
      <div class="details">
        <h1 id="movieTitle">Loading...</h1>
        <p id="movieDesc"></p>
      </div>
      
      <div class="download-section" id="downloadLinks">
        </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
